[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fatsecret-mcp-server"
version = "0.1.0"
description = "MCP server for the FatSecret Platform and member recipe workflows"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "ChocoTonic" }]
dependencies = [
    "fatsecret>=5.0.0,<6",
    "filelock>=3.19,<4",
    "keyring>=25.6,<26",
    "mcp>=2.1,<3",
    "platformdirs>=4.4,<5",
    "pydantic>=2.11,<3",
    "requests>=2.32,<3",
]

[project.scripts]
fatsecret-mcp-server = "fatsecret_mcp_server.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.31",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fatsecret_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests"]
